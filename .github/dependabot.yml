version: 2

# Workflow actions only. Weekly, grouped into one PR, so a runtime
# deprecation like the Node 20 one arrives as a single bump rather than
# a warning nobody reads.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns:
          - "*"
